# profiles/template.yaml
# Szablon dla nowego portalu — skopiuj i uzupełnij
# Plik: profiles/<portal_id>.yaml
# Refaktor D6b: 2026-06-20 | vse-dev-21 — dane kanału w channels/*.yaml

portal_id: "WYPELNIJ"           # np. kurier365, biznesciti, myportal
display_name: "Nazwa Portalu"
site_brand: "Brand Portalu"
active: true

# ---- WordPress ----
wp_base_url: "https://twojportal.pl"
wp_user: "${WP_USER_PORTAL}"
wp_app_password: "${WP_APP_PASS_PORTAL}"

# ---- Kanały źródłowe (D6b) ----
# CO: Lista kanałów YouTube powiązanych z tą witryną.
# PO CO: Każda witryna może mieć wiele kanałów źródłowych,
#        każdy z własnym domyślnym typem publikacji.
# JAK: Utwórz plik channels/<channel_id>.yaml i dodaj referencję tutaj.
#      Dostępne typy: full_analysis | watching_page | discover
source_channels:
  - channel: "prawy-tv"            # ID kanału z channels/
    default_type: "full_analysis"   # domyślny typ publikacji
  # - channel: "drugi-kanal"
  #   default_type: "watching_page"

# ---- Gemini AI ----
gemini_api_key: "${GEMINI_API_KEY}"
gemini_model: "gemini-2.5-flash"

# ---- SEO customization ----
seo:
  language: pl
  chapter_js_class: "portal-chapter"     # CSS class dla linków do rozdziałów
  seek_fn_name: "portalSeek"             # Nazwa funkcji JS seekTo

# ---- SEO external link (RankMath wymaga min. 1 linku zewnętrznego) ----
seo_external_link:
  url: "https://www.youtube.com"
  anchor: "Źródło wideo"

# ---- Publish delay ----
publish_delay:
  min: 5
  max: 37

# ---- Ścieżki ----
paths:
  subs_dir: "data/PORTAL_ID/subs"
  seo_dir: "data/PORTAL_ID/seo_results"
  registry_dir: "data/PORTAL_ID/registry"
  cookies_file: "cookies/PORTAL_ID_cookies.txt"

# ---- Monitor ----
monitor:
  interval_seconds: 1800
  lookback_days: 14
  dry_run: false
