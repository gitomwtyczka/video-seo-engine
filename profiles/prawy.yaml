# profiles/prawy.yaml
# Portal: Prawy.pl — ImpresjaAI Video SEO Engine
# Wygenerowany: 2026-05-20 | vse-architect-01
# Refaktor D6b: 2026-06-20 | vse-dev-21 — dane kanału przeniesione do channels/prawy-tv.yaml
#
# UWAGA: Sekrety (hasła, klucze API) NIE są tu wpisywane bezpośrednio.
# Używaj ${NAZWA_ZMIENNEJ} — wartości ładowane z .env lub środowiska.

portal_id: prawy
display_name: "Prawy.pl"
site_brand: "Prawy TV"
active: true

# ---- WordPress ----
wp_base_url: "${WP_BASE_URL}"
wp_user: "${WP_USER}"
wp_app_password: "${WP_APP_PASSWORD}"

# ---- Kanały źródłowe (D6b) ----
# CO: Mapowanie kanałów YouTube na tę witrynę z domyślnym typem publikacji.
# PO CO: Jeden kanał YT → wiele witryn. Każda witryna może mieć inny
#        domyślny typ artykułu (full_analysis vs watching_page).
# JAK: core/channel.py ładuje channels/prawy-tv.yaml, profile.py
#      rozpoznaje source_channels i łączy dane kanału z witryną.
source_channels:
  - channel: "prawy-tv"
    default_type: "full_analysis"  # watching_page | full_analysis | discover

# ---- Gemini AI ----
gemini_api_key: "${GEMINI_API_KEY}"
gemini_model: "gemini-2.5-flash"

# ---- SEO customization ----
seo:
  language: pl
  chapter_js_class: "prawy-chapter"
  seek_fn_name: "prawySeek"

# ---- SEO external link (RankMath wymaga min. 1 linku zewnętrznego) ----
# CO: Stały link zewnętrzny wstawiany do artykułu.
# PO CO: RankMath obniża scoring SEO gdy brak linków zewnętrznych.
#        Jeden link per profil — wstawiany przez build_post_content().
# JAK: injector.py czyta seo_external_link.url + .anchor, buduje <a> tag.
seo_external_link:
  url: "https://www.youtube.com/@PrawyTV"
  anchor: "Kanał Prawy TV na YouTube"

# ---- Smart publish delay (minuty) ----
publish_delay:
  min: 5
  max: 37

# ---- Ścieżki danych (relatywne do CWD) ----
paths:
  subs_dir: "data/prawy/subs"
  seo_dir: "data/prawy/seo_results"
  registry_dir: "data/prawy/registry"
  cookies_file: "cookies/prawy_cookies.txt"   # yt-dlp na VPS

# ---- Monitor ----
monitor:
  interval_seconds: 1800     # 30 min
  lookback_days: 14          # skanuj ostatnie N dni
  dry_run: false

# ===================================================
# PODCAST SHOWS CONFIGURATION
# ===================================================
podcast:
  shows:
    - slug: prawy-biblijny
      name: "Prawy Biblijny — Słowo na dziś"
      description: "Codzienna Ewangelia z komentarzem. Prawy.pl zaprasza na krótkie rozważanie Słowa Bożego."
      yt_playlist_id: null          # uzupełni user po stworzeniu podcastu na YT
      yt_podcast_show_id: null      # YouTube Podcast Show ID (z YT Studio > Podcasty)
      wp_show_slug: prawy-biblijny
      wp_taxonomy: podcast_show
      mp3_server_path: /var/www/html/wp-content/uploads/podcast/prawy-biblijny
      rss_url: https://prawy.pl/podcast-rss/prawy-biblijny/
      publish_time: "07:00:00"
      category: "Religion & Spirituality"
      language: pl
      current_episode: 6           # ostatni wgrany odcinek

    - slug: pluzanski-bez-przemilczen
      name: "Płużański. Bez Przemilczeń!"
      description: "Rozmowy bez przemilczeń — historia, polityka, Polska. Tadeusz Płużański i goście."
      yt_playlist_id: null          # uzupełni user
      yt_podcast_show_id: null      # YouTube Podcast Show ID
      wp_show_slug: pluzanski-bez-przemilczen
      wp_taxonomy: podcast_show
      mp3_server_path: /var/www/html/wp-content/uploads/podcast/pluzanski-bez-przemilczen
      rss_url: https://prawy.pl/podcast-rss/pluzanski-bez-przemilczen/
      publish_time: "18:00:00"
      category: "Society & Culture"
      language: pl
      current_episode: 18
