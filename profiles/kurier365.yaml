# profiles/kurier365.yaml
# Portal: Kurier365.pl — PressAI SaaS tenant
# Utworzono: 2026-05-20 | vse-strateg-01
# Refaktor D6b: 2026-06-20 | vse-dev-21 — dane kanału przeniesione do channels/

portal_id: "kurier365"
display_name: "Kurier365.pl"
site_brand: "Kurier365"
active: true

# ---- WordPress ----
wp_base_url: "https://kurier365.pl"
wp_user: "${WP_KURIER365_USER}"
wp_app_password: "${WP_KURIER365_APP_PASSWORD}"

# ---- Kanały źródłowe (D6b) ----
# CO: kurier365 używa kanału prawy-tv jako źródła, ale z innym typem publikacji.
# PO CO: watching_page = krótki artykuł z embedem i chapterami (bez rozbudowanego body).
# JAK: generator.py dostaje publication_type z tego mapowania.
source_channels:
  - channel: "prawy-tv"
    default_type: "watching_page"

# ---- Gemini AI ----
gemini_api_key: "${GEMINI_API_KEY}"
gemini_model: "gemini-2.5-flash"

# ---- SEO customization ----
seo:
  language: pl
  chapter_js_class: "kurier-chapter"
  seek_fn_name: "kurierSeek"

# ---- SEO external link (RankMath wymaga min. 1 linku zewnętrznego) ----
# CO: Stały link zewnętrzny wstawiany do artykułu.
# PO CO: RankMath obniża scoring SEO gdy brak linków zewnętrznych.
# JAK: injector.py czyta seo_external_link.url + .anchor, buduje <a> tag.
seo_external_link:
  url: "https://www.youtube.com"
  anchor: "Źródło wideo na YouTube"

# ---- Publish delay ----
publish_delay:
  min: 5
  max: 37

# ---- Ścieżki ----
paths:
  subs_dir: "data/kurier365/subs"
  seo_dir: "data/kurier365/seo_results"
  registry_dir: "data/kurier365/registry"
  cookies_file: "cookies/kurier365_cookies.txt"

# ---- Monitor ----
monitor:
  interval_seconds: 1800
  lookback_days: 14
  dry_run: false
