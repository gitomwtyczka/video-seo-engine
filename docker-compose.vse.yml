# ── VSE Stack: API + PostgreSQL ──
# Frontend (Next.js) dodawany w Fazie 1 DevOps

services:

  vse-postgres:
    image: postgres:16-alpine
    container_name: vse-postgres
    environment:
      POSTGRES_DB: vse
      POSTGRES_USER: vse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vse-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vse"]
      interval: 10s
      timeout: 5s
      retries: 5

  vse-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: vse-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vse:${POSTGRES_PASSWORD}@vse-postgres:5432/vse
    ports:
      - "8085:8085"
    depends_on:
      vse-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vse-net

volumes:
  vse-pgdata:

networks:
  vse-net:
    driver: bridge
