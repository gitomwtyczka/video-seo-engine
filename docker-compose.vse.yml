# VSE API — docker-compose
# Start: docker compose -f docker-compose.vse.yml up -d --build
# Stop:  docker compose -f docker-compose.vse.yml down

version: '3.8'

services:
  vse-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: vse-api
    ports:
      - "8085:8085"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
